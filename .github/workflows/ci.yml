name: Integración Continua (CI)
# Definimos el evento que disparará este workflow.
# Se ejecutará con cada 'push' a la rama 'main'.
on:
  push:
    branches: [ main ]
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
      - name: 1. Descargar Código del Repositorio
        uses: actions/checkout@v4
        
      - name: 2. Configurar Entorno de Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: 3. Instalar Dependencias de Proyecto
        run: npm ci

      - name: 4. Ejecutar Pruebas Unitarias con Jest
        run: npm test
        
  deploy: # El nuevo Job de Despliegue
   runs-on: ubuntu-latest
   needs: [build_and_test] # ¡CLAVE! Solo se ejecuta si el CI fue exitoso
   steps:
    - name: 1. Descargar Código para Despliegue
      uses: actions/checkout@v4
      
# 2. Configuración de Ambiente (similar al CI) - Opcional

    - name: 3. Despliegue (Simulación)
      run: echo "Despliegue Exitoso en Staging/Producción..."
      env:
        # NOTA: En un caso real, la clave de API iría aquí, protegida.
        # CLOUD_API_TOKEN: ${{ secrets.CLOUD_API_TOKEN }}
        API_STATUS: OK # Variable de ejemplo

  
